  #     DB_PASSWORD: ${ORDERS_DB_PASSWORD:-orders_dev_pw}
  #     RABBITMQ_HOST: rabbitmq
  #     RABBITMQ_USER: orders_mq
  #     RABBITMQ_PASSWORD: ${ORDERS_MQ_PASSWORD:-orders_mq_dev_pw}
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     rabbitmq: { condition: service_healthy }
  #   networks: [eatsnow]
