server:
  port: 8080
  # Identity is reached through the Gateway: build login redirects from X-Forwarded-* (public host localhost:8090).
  forward-headers-strategy: framework

management:
  server:
    port: 8081 # Spec 6.1: Management port not routed by Gateway, scraped by Prometheus
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0 # Spec 6.3: 100% sampling in Wave 2
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://otel-collector:4318/v1/traces}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

spring:
  application:
    name: identity
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/eatsnow?currentSchema=identity}
    username: ${DB_USER:identity_svc}
    password: ${IDENTITY_DB_PASSWORD:identity_dev_pw}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: identity
        format_sql: false
  flyway:
    enabled: true
    schemas: identity
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST:mailpit}
    port: ${SMTP_PORT:1025}

eatsnow:
  identity:
    # Public issuer (Spec 3.1): the Gateway. Tokens carry it as `iss` whatever host a request reached Identity on.
    issuer: ${IDENTITY_ISSUER:http://localhost:8090}
    public-url: ${IDENTITY_PUBLIC_URL:http://localhost:8090}
    mail-from: ${IDENTITY_MAIL_FROM:no-reply@eatsnow.test}
    clients:
      web:
        redirect-uris: ${WEB_REDIRECT_URIS:http://localhost:5173/callback}
        post-logout-redirect-uri: ${WEB_POST_LOGOUT_REDIRECT_URI:http://localhost:5173/}
      cli:
        redirect-uris: ${CLI_REDIRECT_URIS:http://127.0.0.1:8765/callback,https://oauth.pstmn.io/v1/callback}
        secret: ${CLI_CLIENT_SECRET:dev-cli-secret} # DEV ONLY
      notifications:
        secret: ${NOTIFICATIONS_CLIENT_SECRET:dev-notifications-secret} # DEV ONLY
  internal:
    allowed-clients: notifications # Spec 3.7: clients allowed on /internal/v1/profiles/{id}/contact

logging:
  level:
    root: INFO
    com.eatsnow.identity: DEBUG
