server:
  port: 8080

management:
  server:
    port: 8081 # Spec 6.1: Management port not routed by Gateway, scraped by Prometheus
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when_authorized

spring:
  application:
    name: identity
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/eatsnow?currentSchema=identity}
    username: ${DB_USER:identity_svc}
    password: ${IDENTITY_DB_PASSWORD:identity_dev_pw}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: identity
        format_sql: false
  flyway:
    enabled: true
    schemas: identity
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.eatsnow.identity: DEBUG
