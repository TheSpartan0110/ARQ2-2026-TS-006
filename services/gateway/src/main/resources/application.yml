server:
  port: 8080

management:
  server:
    port: 8081 # Spec 6.1: Management port not routed by the Gateway, scraped by Prometheus
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: 1.0 # Spec 6.3
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://otel-collector:4318/v1/traces}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

spring:
  application:
    name: gateway
  main:
    banner-mode: off
  reactor:
    context-propagation: auto # keeps the trace context across reactive threads
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 10s
      # The browser app (another origin) calls the API and the token endpoint directly (ADR 005).
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins: ${WEB_ORIGINS:http://localhost:5173}
            allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowed-headers: "*"
            exposed-headers: [X-Correlation-ID, X-Trace-Id, Location, Retry-After]
            max-age: 3600
      routes:
        # Public: the OIDC provider (Spring Authorization Server) and its login, registration and activation
        # pages, so the issuer and the login live behind the single entry point. Everything else needs a token.
        - id: identity-public
          uri: ${IDENTITY_URL:http://identity:8080}
          predicates:
            - Path=/oauth2/**,/.well-known/openid-configuration,/.well-known/oauth-authorization-server,/userinfo,/connect/**,/login,/logout,/register,/activate,/css/**
        - id: identity
          uri: ${IDENTITY_URL:http://identity:8080}
          predicates:
            - Path=/api/v1/profiles/**,/api/v1/admin/**
        # /api/v1/catalog/jwks.json is internal and deliberately not routed
        - id: catalog
          uri: ${CATALOG_URL:http://catalog:8080}
          predicates:
            - Path=/api/v1/restaurants/**,/api/v1/quotes
        - id: orders
          uri: ${ORDERS_URL:http://orders:8080}
          predicates:
            - Path=/api/v1/orders/**
        - id: restaurants
          uri: ${RESTAURANTS_URL:http://restaurants:8080}
          predicates:
            - Path=/api/v1/restaurant-orders/**
        - id: delivery
          uri: ${DELIVERY_URL:http://delivery:8080}
          predicates:
            - Path=/api/v1/drivers/**,/api/v1/deliveries/**
        # /internal/** (for example Identity's contact endpoint) is never routed: it is not public (Spec 3.7)

eatsnow:
  jwks:
    identity-url: ${IDENTITY_JWKS_URL:http://identity:8080/oauth2/jwks}
  identity:
    issuer: ${IDENTITY_ISSUER:http://localhost:8090} # Spec 3.1: tokens must carry this `iss`

logging:
  level:
    root: INFO
    com.eatsnow.gateway: DEBUG
