server:
  port: 8080

management:
  server:
    port: 8081 # Spec 6.1: Management port not routed by Gateway, scraped by Prometheus
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when_authorized

spring:
  application:
    name: catalog
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/eatsnow?currentSchema=catalog}
    username: ${DB_USER:catalog_svc}
    password: ${CATALOG_DB_PASSWORD:catalog_dev_pw}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: catalog
        format_sql: false
  flyway:
    enabled: true
    schemas: catalog
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

logging:
  level:
    root: INFO
    com.eatsnow.catalog: DEBUG
