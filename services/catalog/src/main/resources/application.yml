server:
  port: 8080

management:
  server:
    port: 8081 # Spec 6.1: Management port not routed by Gateway, scraped by Prometheus
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0 # Spec 6.3: 100% sampling in Wave 2
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://otel-collector:4318/v1/traces}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true # buckets for the CatalogSlow p95 alert (Spec 6.4)

spring:
  application:
    name: catalog
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/eatsnow?currentSchema=catalog}
    username: ${DB_USER:catalog_svc}
    password: ${CATALOG_DB_PASSWORD:catalog_dev_pw}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: catalog
        format_sql: false
  flyway:
    enabled: true
    schemas: catalog
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 500ms          # cache only: fail fast and fall back to PostgreSQL (RedisConfig)
      connect-timeout: 500ms

eatsnow:
  security:
    identity-jwks-url: ${IDENTITY_JWKS_URL:http://identity:8080/oauth2/jwks}
    issuer: ${IDENTITY_ISSUER:http://localhost:8090}
    required-role: ANY # Spec 3.3: catalog reads for any active role; POST /quotes also requires USER
    public-paths: /api/v1/catalog/jwks.json # quote-signing keys, fetched by Orders without a user token

logging:
  level:
    root: INFO
    com.eatsnow.catalog: DEBUG
