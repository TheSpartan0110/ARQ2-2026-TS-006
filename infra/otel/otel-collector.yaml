# OpenTelemetry Collector (spec 6.1)
#   traces: services --OTLP--> Collector --> Tempo and Jaeger
# Logs are shipped to Loki by Grafana Alloy (infra/alloy/config.alloy), which reads them through the Docker API.
# Metrics are NOT sent here: Prometheus scrapes each service directly.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Same traces to Jaeger: its UI is the trace inspector for demos (ADR 003). Tempo keeps the Grafana
  # log <-> trace links and the service graph.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      level: basic
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, otlp/jaeger]
